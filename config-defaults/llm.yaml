# Параметры локальной нейросети и STT
backend: ""                         # OpenAI-compat адрес (llama-server / vLLM / Ollama), напр. http://127.0.0.1:8080; пусто ⇒ встроенный llama-server
api_key: ""                          # "ollama" style dummy accepted
mmproj_path: ""                      # GGUF-проектор для vision (--mmproj); пусто ⇒ авто-детект соседнего *mmproj*/*projector*.gguf рядом с моделью
model: gemma4-abliterated            # served model name
ctx: 16384
temperature: 0.85
repeat_penalty: 1.05
stop_tokens: ["<end_of_turn>"]
presets:
  gemma4-abliterated:
    chat_template: "<start_of_turn>user\n{user}<end_of_turn>\n<start_of_turn>model\n"
    eos_token: "<end_of_turn>"
    bos_token: "<start_of_turn>"
    # template vars follow llama.cpp conventions
stt:
  whisper_model_path: "models/whisper/small-fp16"   # local weights; empty ⇒ library default download
  device: cuda
  compute_type: float16
